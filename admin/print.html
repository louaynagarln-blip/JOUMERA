<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>طباعة الطلب</title><style>body{font-family:Arial;padding:20px;color:#111}table{width:100%;border-collapse:collapse}td,th{border:1px solid #ccc;padding:8px;text-align:right}.top{display:flex;justify-content:space-between}@media print{button{display:none}}</style></head><body><div id="x">جاري التحميل...</div><script>const API='https://aiizdgxutredbzcrkkjq.supabase.co/functions/v1/hoco-api',id=new URLSearchParams(location.search).get('id'),t=localStorage.getItem('hoco_admin_token');fetch(API+'/admin/state',{headers:{Authorization:'Bearer '+t}}).then(r=>r.json()).then(s=>{const o=(s.orders||[]).find(x=>x.id===id);if(!o)throw Error('غير موجود');document.querySelector('#x').innerHTML=`<div class="top"><h1>JOUMERA</h1><button onclick="print()">طباعة</button></div><h2>طلب ${o.orderNo}</h2><p><b>الزبون:</b> ${o.customerName}</p><p><b>الهاتف:</b> ${o.phone||''}</p><p><b>العنوان:</b> ${o.address||''}</p><table><tr><th>المنتج</th><th>الكمية</th><th>السعر</th><th>المجموع</th></tr>${o.items.map(i=>`<tr><td>${i.name}</td><td>${i.qty}</td><td>$${Number(i.unitPrice).toFixed(2)}</td><td>$${Number(i.total).toFixed(2)}</td></tr>`).join('')}</table><h2>الإجمالي: $${Number(o.total).toFixed(2)}</h2><p>${o.notes||''}</p>`}).catch(e=>document.querySelector('#x').textContent=e.message)</script></body></html>
