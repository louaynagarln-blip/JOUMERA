<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0e0d0c" />
  <title>JOUMERA V-MALL</title>
</head>
<body>
  <div id="stage"></div>
  <div id="look"></div>

  <div id="hud" class="hidden">
    <header class="bar">
      <span class="brand">JOUMERA</span>
      <nav>
        <button id="btn-search" data-i18n="search" aria-label="Search"></button>
        <button id="btn-stores" data-i18n="stores"></button>
        <button id="btn-cart"><span data-i18n="cart"></span> <b id="cart-count">0</b></button>
        <button id="btn-settings" aria-label="Settings">&#9881;</button>
      </nav>
    </header>
    <div id="banner"></div>
    <button id="interact" class="hidden"></button>
    <div id="joy"><div id="knob"></div></div>
  </div>

  <section id="loading">
    <div class="logo">JOUMERA</div>
    <div class="sub">V-MALL</div>
    <div class="progress"><i id="bar"></i></div>
    <p id="load-label" data-i18n="loading"></p>
    <button id="enter" class="primary hidden" data-i18n="enter"></button>
    <button id="lang-intro" class="ghost">العربية / English</button>
  </section>

  <section id="tutorial" class="overlay hidden">
    <div class="card">
      <h2 data-i18n="tutTitle"></h2>
      <p data-i18n="tutBody"></p>
      <label class="check"><input type="checkbox" id="tut-never" /> <span data-i18n="dontShow"></span></label>
      <button id="tut-go" class="primary" data-i18n="start"></button>
    </div>
  </section>

  <section id="menu-stores" class="overlay hidden"></section>
  <section id="search-modal" class="overlay hidden"></section>
  <section id="modal" class="overlay hidden"></section>
  <section id="settings" class="overlay hidden"></section>
  <aside id="drawer" class="drawer hidden"></aside>
  <section id="fallback" class="fallback hidden"></section>
  <div id="toast" role="status"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
