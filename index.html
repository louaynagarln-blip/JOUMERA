<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FBF8F4"><meta name="description" content="JOUMERA home and lifestyle products in Lebanon"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="JOUMERA"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="icon" type="image/png" href="/favicon.png"><link rel="manifest" href="/manifest.webmanifest"><title>JOUMERA | Home & Lifestyle</title><style>:root{
  --a:#C99F7A;--a2:#B88962;--bg:#F7F4F0;--c:#fff;--t:#17191C;--m:#7A8088;--l:#E9E5E0;
  --soft:#F3EEE8;--shadow:0 18px 55px rgba(40,31,23,.08);--cc:3;--pc:2;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--t);font-family:Arial,Tahoma,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{width:100%;max-width:1380px;margin:0 auto;background:#fff;min-height:100vh;padding-bottom:92px;overflow:hidden}
.hero{height:210px;background:linear-gradient(135deg,#F7F0E9 0%,#E7D2C0 100%);position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.1),rgba(255,255,255,0))}
.hero:after{content:'JOUMERA';position:absolute;left:18px;bottom:12px;color:rgba(255,255,255,.30);font-size:56px;line-height:.9;font-weight:900;letter-spacing:2px;pointer-events:none}
.heroimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.install{display:none;position:absolute;right:14px;top:14px;border:0;border-radius:13px;background:var(--a);color:#fff;padding:10px 13px;font-weight:800;z-index:3;box-shadow:0 8px 22px rgba(0,0,0,.12)}
.store{position:relative;margin:-34px 12px 0;background:rgba(255,255,255,.97);border:1px solid rgba(255,255,255,.75);border-radius:23px;padding:16px;box-shadow:0 14px 38px rgba(35,26,19,.10);z-index:2;backdrop-filter:blur(8px)}
.st{display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--l);padding-bottom:13px}
.logo{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:#161719;color:#fff;font-size:10px;letter-spacing:.3px;font-weight:900;box-shadow:0 7px 18px rgba(0,0,0,.13)}
.st h1{margin:0;font-size:23px;letter-spacing:.4px}
.meta{display:grid;grid-template-columns:1fr 1fr;text-align:center;padding-top:12px;gap:8px}
.meta>div+div{border-right:1px solid var(--l)}
.meta b{display:block;margin-top:4px;font-size:13px}
.muted{color:var(--m)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:16px 12px}
.q{border:1px solid var(--l);background:linear-gradient(180deg,#fff,#FCFBF9);border-radius:16px;padding:13px;text-align:right;min-height:66px;transition:.2s}
.q:active{transform:scale(.985)}
.q b{font-size:14px}
.q .muted{font-size:12px;margin-top:4px}
.search{margin:0 12px 19px;border:1px solid var(--l);border-radius:15px;display:flex;align-items:center;padding:0 13px;background:#fff;box-shadow:0 5px 18px rgba(40,31,23,.035)}
.search:focus-within{border-color:var(--a);box-shadow:0 0 0 3px rgba(201,159,122,.11)}
.search input{height:48px;border:0;outline:0;flex:1;min-width:0;background:transparent;color:var(--t)}
.search span{font-size:22px;color:var(--m)}
.sec{padding:0 12px 22px}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;gap:8px}
.head h2{margin:0;font-size:19px}
.cats,.brands{display:grid;grid-template-columns:repeat(var(--cc),1fr);gap:9px}
.cat,.brandbtn{border:0;background:transparent;text-align:center;min-width:0;padding:0}
.catbox{aspect-ratio:1;border-radius:17px;background:#F4F2EF;display:grid;place-items:center;font-size:32px;border:2px solid transparent;overflow:hidden;transition:.2s}
.cat.active .catbox{border-color:var(--a);background:#FFF8F2}
.cat span,.brandbtn span{display:block;font-size:11px;font-weight:700;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brandbox{aspect-ratio:1;border:1px solid var(--l);border-radius:16px;background:#fff;display:grid;place-items:center;overflow:hidden;font-weight:900;padding:8px;transition:.2s}
.brandbtn.active .brandbox{border:2px solid var(--a)}
.catbox img,.pi img,.brandbox img{width:100%;height:100%;object-fit:cover}
.products{display:grid;grid-template-columns:repeat(var(--pc),1fr);gap:10px}
.p{border:1px solid var(--l);border-radius:17px;overflow:hidden;background:#fff;transition:.22s;min-width:0}
.pi{aspect-ratio:1;background:#F5F4F2;display:grid;place-items:center;font-size:40px;overflow:hidden}
.pb{padding:10px}
.pb h3{margin:0 0 4px;font-size:14px;line-height:1.35}
.model{font-size:11px;color:var(--m)}
.price{font-size:17px;font-weight:900;margin:7px 0}
.btn{border:0;border-radius:10px;background:var(--a);color:#fff;padding:9px 12px;font-weight:800;transition:.2s}
.btn:active{transform:scale(.98)}
.btn.light{background:#fff;color:#111;border:1px solid var(--l)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(1380px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,255,255,.94);border-top:1px solid var(--l);backdrop-filter:blur(14px);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.bottom button{border:0;background:transparent;min-height:66px;color:#747982;font-size:12px}
.bottom b{display:block;font-size:20px;margin-bottom:3px}
.bottom .on{color:var(--a)}
.cartbadge{position:relative}
.num{position:absolute;top:4px;right:calc(50% - 18px);background:var(--a);color:#fff;min-width:18px;height:18px;border-radius:9px;font-size:10px;display:grid;place-items:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.50);z-index:60;display:none;align-items:flex-end;justify-content:center;padding-top:6vh}
.modal.open{display:flex}
.sheet{width:min(880px,100%);background:#fff;border-radius:24px 24px 0 0;max-height:94vh;overflow:auto;padding:18px}
.mh{display:flex;gap:10px;align-items:center;position:sticky;top:-18px;background:#fff;padding:14px 0;border-bottom:1px solid var(--l);z-index:2}
.sp{flex:1}
.cartrow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:11px 0;border-bottom:1px solid var(--l)}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:32px;height:32px;border:1px solid var(--l);background:#fff;border-radius:9px}
.field{display:grid;gap:5px;margin:10px 0}
.field input,.field textarea{border:1px solid var(--l);border-radius:12px;padding:11px}
.tabs{display:flex;gap:8px;margin:10px 0}
.empty{padding:30px 18px;text-align:center;color:var(--m);border:1px dashed #DCD6CF;border-radius:17px;grid-column:1/-1;background:#FCFBF9}
.pages{display:flex;gap:10px;flex-wrap:wrap;padding:6px 12px 25px}
.pages button{border:0;background:transparent;color:#555;text-decoration:underline}
.toast{position:fixed;bottom:82px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:11px 15px;border-radius:12px;display:none;z-index:100}
.toast.on{display:block}
.couponrow{display:grid;grid-template-columns:1fr auto;gap:8px}
.couponrow input{border:1px solid var(--l);border-radius:11px;padding:10px}
.maintenance{padding:40px 20px;text-align:center}
.banner-inline{border-radius:18px;overflow:hidden;box-shadow:0 10px 28px rgba(40,31,23,.07)}
.banner-inline img{width:100%;display:block}
.loading{padding:30px;text-align:center;color:var(--m)}

@media(min-width:700px){
  :root{--cc:5;--pc:3}
  .app{padding-bottom:110px}
  .hero{height:280px}
  .hero:after{font-size:86px;left:30px;bottom:18px}
  .store{margin:-58px 28px 0;padding:20px 24px}
  .quick{margin:22px 28px 16px}
  .search{margin:0 28px 24px}
  .sec{padding:0 28px 28px}
  .pages{padding-left:28px;padding-right:28px}
}

@media(min-width:1024px){
  :root{--cc:6;--pc:4}
  body{padding:24px}
  .app{border-radius:28px;box-shadow:var(--shadow);padding-bottom:42px}
  .hero{height:360px;border-radius:28px 28px 0 0}
  .hero:after{font-size:120px;left:48px;bottom:24px;letter-spacing:5px;color:rgba(255,255,255,.26)}
  .install{right:30px;top:30px}
  .store{width:470px;margin:-88px 42px 0 auto;border-radius:25px;padding:22px 24px}
  .logo{width:62px;height:62px;border-radius:18px;font-size:11px}
  .st h1{font-size:28px}
  .quick{max-width:650px;margin:28px 42px 18px auto}
  .q{padding:16px 18px;min-height:78px}
  .q b{font-size:16px}
  .search{margin:0 42px 32px;height:58px}
  .search input{height:56px;font-size:15px}
  .sec{padding:0 42px 34px}
  .head h2{font-size:24px}
  .cats,.brands{gap:16px}
  .catbox,.brandbox{border-radius:20px}
  .cat span,.brandbtn span{font-size:13px;margin-top:8px}
  .products{gap:18px}
  .p{border-radius:20px}
  .p:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(40,31,23,.10);border-color:#DED5CC}
  .pb{padding:14px}
  .pb h3{font-size:16px}
  .model{font-size:12px}
  .price{font-size:20px}
  .bottom{top:42px;bottom:auto;left:42px;transform:none;width:auto;grid-template-columns:repeat(4,auto);border:1px solid rgba(233,229,224,.9);border-radius:18px;overflow:hidden;box-shadow:0 10px 28px rgba(40,31,23,.08);padding:0;background:rgba(255,255,255,.95)}
  .bottom button{min-height:54px;min-width:92px;padding:7px 14px;font-size:12px}
  .bottom b{font-size:17px;margin-bottom:1px}
  .num{top:3px;right:calc(50% - 20px)}
  .modal{align-items:center;padding:5vh 20px}
  .sheet{border-radius:24px;max-height:90vh}
  .toast{bottom:30px}
}

@media(min-width:1280px){
  :root{--cc:7;--pc:4}
  .hero{height:390px}
  .sec{padding-left:54px;padding-right:54px}
  .search{margin-left:54px;margin-right:54px}
  .quick{margin-right:54px}
}

@media(max-width:380px){
  .store{margin-left:8px;margin-right:8px}
  .sec{padding-left:8px;padding-right:8px}
  .quick,.search{margin-left:8px;margin-right:8px}
  .hero:after{font-size:48px}
}</style></head><body><main class="app"><section class="hero" id="hero"><button class="install" id="install">ثبّت التطبيق</button></section><section class="store"><div class="st"><div class="logo">JOUMERA</div><div><h1 id="storeName">JOUMERA</h1><div class="muted" id="storeSub">Home & Lifestyle</div></div></div><div class="meta"><div><span class="muted">التقييمات</span><b>4.9 ★</b></div><div><span class="muted">حسابي</span><b id="accountLabel">دخول / تسجيل</b></div></div></section><section class="quick" id="quick"><button class="q" id="offers"><b id="q1">العروض</b><div class="muted" id="q1s">أفضل الخصومات</div></button><button class="q" id="new"><b id="q2">الجديد</b><div class="muted" id="q2s">وصل حديثًا</div></button></section><div class="search"><input id="search" placeholder="ابحث عن منتج أو موديل..."><span>⌕</span></div><div id="home"><div class="loading">جاري تحميل المنتجات...</div></div><div class="pages" id="pages"></div></main><nav class="bottom"><button class="on" id="shop"><b>▣</b>تسوّق</button><button id="categoriesBtn"><b>⌘</b>الأقسام</button><button id="accountBtn"><b>◎</b>حسابي</button><button class="cartbadge" id="cartBtn"><b>🛒</b>السلة<span class="num" id="cartNum">0</span></button></nav><div class="modal" id="cartModal"><div class="sheet"><div class="mh"><h2>سلة الطلب</h2><div class="sp"></div><button class="btn light close">إغلاق</button></div><div id="cartRows"></div><div class="head"><b>المجموع قبل الخصم</b><b id="cartTotal">$0.00</b></div><div class="couponrow"><input id="couponCode" placeholder="كود الخصم - اختياري"><button class="btn light" id="couponHint">استخدام</button></div><div class="muted" style="font-size:12px;margin-top:5px">الخصم النهائي يُحسب على السيرفر عند إرسال الطلب.</div><label class="field"><span>عنوان التوصيل</span><input id="orderAddress" placeholder="المنطقة - الشارع"></label><label class="field"><span>ملاحظات</span><textarea id="orderNotes" rows="2"></textarea></label><button class="btn" id="orderBtn" style="width:100%">إرسال الطلب</button></div></div><div class="modal" id="accountModal"><div class="sheet"><div class="mh"><h2>حساب الزبون</h2><div class="sp"></div><button class="btn light close">إغلاق</button></div><div id="accountArea"></div></div></div><div class="modal" id="pageModal"><div class="sheet"><div class="mh"><h2 id="pageTitle"></h2><div class="sp"></div><button class="btn light close">إغلاق</button></div><div id="pageContent"></div></div></div><div class="toast" id="toast"></div><script src="https://aiizdgxutredbzcrkkjq.supabase.co/functions/v1/hoco-assets/site.js"></script></body></html>
