<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JOUMERA — 3D Mall</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d17;color:#f6f2ec;font:15px system-ui,Arial}button{cursor:pointer;font:inherit}header{position:absolute;z-index:4;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:20px clamp(16px,4vw,65px);background:linear-gradient(#080b14ed,transparent)}.brand{font-weight:900;letter-spacing:4px;font-size:22px}.brand span{color:#d9b48a}.pill{background:#ffffff17;border:1px solid #ffffff36;color:#fff;border-radius:40px;padding:11px 17px}.stage{height:100dvh;min-height:530px;position:relative;overflow:hidden}.stage canvas{width:100%;height:100%;display:block;touch-action:none}.intro{position:absolute;z-index:2;top:100px;left:clamp(18px,5vw,80px);pointer-events:none;max-width:440px}.intro small{color:#dfbd91;letter-spacing:3px;font-weight:700}.intro h1{font-size:clamp(30px,4.5vw,65px);line-height:1.02;margin:12px 0}.intro p{color:#c5c8d4;line-height:1.6}.hud{position:absolute;z-index:3;bottom:26px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:#111a2ae8;border:1px solid #ffffff30;border-radius:22px;padding:12px;backdrop-filter:blur(12px)}.hud button,.primary{background:#d6ac78;border:0;border-radius:13px;color:#15131b;font-weight:800;padding:13px 19px}.hud .ghost{background:#ffffff16;color:white}.panel{position:absolute;z-index:5;right:18px;top:90px;width:min(380px,calc(100% - 36px));max-height:calc(100dvh - 180px);overflow:auto;background:#121a2af5;border:1px solid #ffffff30;border-radius:20px;padding:22px;box-shadow:0 25px 70px #0009}.panel[hidden]{display:none}.panel h2{margin:0 0 8px}.muted{color:#aeb5c5}.product{border-top:1px solid #ffffff26;padding:14px 0;display:flex;justify-content:space-between;gap:12px}.product button{background:#d6ac78;border:0;border-radius:9px;padding:8px 10px;font-weight:700}.standtag{position:absolute;z-index:2;bottom:115px;left:50%;transform:translateX(-50%);color:#ddd;pointer-events:none;text-align:center}.controls{display:none}.shopnav{position:absolute;z-index:3;bottom:100px;left:50%;transform:translateX(-50%);display:flex;gap:9px;max-width:calc(100vw - 20px);overflow-x:auto;padding:7px;scrollbar-width:none}.shopnav button{white-space:nowrap;border:1px solid #ffffff66;background:#101b2cdd;color:white;border-radius:18px;padding:13px 17px;backdrop-filter:blur(12px)}.shopnav button:focus{outline:2px solid #d9b488}.controls button{width:45px;height:45px;border-radius:10px;border:1px solid #ffffff55;background:#101828d9;color:white;font-size:20px}.controls .up{grid-column:2}.controls .left{grid-column:1}.controls .down{grid-column:2}.controls .right{grid-column:3}.note{font-size:12px;color:#9ea6b6}input{padding:12px;width:100%;background:#0b1020;color:#fff;border:1px solid #ffffff30;border-radius:10px;margin:10px 0}@media(max-width:700px){header{padding:17px}.brand{font-size:17px}.intro{top:82px;max-width:255px}.intro p{font-size:12px}.hud{bottom:12px;white-space:nowrap}.hud button{padding:12px}.shopnav{bottom:85px;width:calc(100% - 20px);justify-content:flex-start}.intro{transition:opacity .45s}.intro.hide{opacity:0}.standtag{bottom:175px}.panel{top:74px}}
</style></head><body><div class="stage"><header><div class="brand">JOU<span>MERA</span> <small style="font-size:9px;letter-spacing:1px">3D MALL</small></div><button class="pill" id="cartBtn">🛒 Cart <b id="count">0</b></button></header><div class="intro"><small>THE FUTURE OF SHOPPING</small><h1>Step inside.<br>Explore more.</h1><p>Walk through an immersive 3D shopping mall, discover vendor stands, and add products to your cart.</p></div><canvas id="scene" aria-label="Interactive 3D mall"></canvas><div class="standtag" id="hint">Tap a storefront to enter · Drag to look around</div><div class="controls"><button class="up" data-move="forward">↑</button><button class="left" data-move="left">←</button><button class="down" data-move="back">↓</button><button class="right" data-move="right">→</button></div><nav class="shopnav" id="shopnav" aria-label="Showrooms"></nav><div class="hud"><button id="enter">Visit first store</button><button class="ghost" id="reset">Entrance</button></div><aside class="panel" id="panel" hidden><button class="pill" id="close" style="float:right">✕</button><h2 id="panelTitle">Showroom</h2><p class="muted" id="panelSub"></p><div id="panelBody"></div></aside></div><script type="module">
import * as THREE from 'https://esm.sh/three@0.170.0';
const canvas=document.getElementById('scene'),scene=new THREE.Scene();scene.background=new THREE.Color('#0d1525');scene.fog=new THREE.Fog('#0d1525',28,95);
const camera=new THREE.PerspectiveCamera(65,1,.1,120);camera.position.set(0,2.2,12);let yaw=0;
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.35;
scene.add(new THREE.HemisphereLight('#b9d9ff','#4e3c36',2.3));const sun=new THREE.DirectionalLight('#ffe3b9',3);sun.position.set(1,12,4);scene.add(sun);
function block(w,h,d,x,y,z,color,metal=0){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,metalness:metal,roughness:.4}));o.position.set(x,y,z);scene.add(o);return o}
block(25,.2,80,0,-.1,-17,'#d4d0c8');block(25,10,.5,-12,5,-17,'#172339');block(25,10,.5,12,5,-17,'#172339');block(25,.35,80,0,9,-17,'#1c283c');block(5,.03,80,0,.03,-17,'#9a948b');for(let z=8;z>-49;z-=7){block(24,.08,.12,0,8.7,z,'#f1c995');block(.12,8,.12,0,4.5,z,'#28364d')}

/* Architectural details: illuminated soffits, tiled stone, storefront glazing and display props */
const gold='#d8b780',stone='#ded9ce',dark='#182437';
function cylinder(rt,rb,h,x,y,z,color,metal=0){const mesh=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,16),new THREE.MeshStandardMaterial({color,metalness:metal,roughness:.48}));mesh.position.set(x,y,z);scene.add(mesh);return mesh}
function textPlane(text,w,h,x,y,z,fg='#fff',bg='#182437'){const c=document.createElement('canvas');c.width=768;c.height=192;const ctx=c.getContext('2d');ctx.fillStyle=bg;ctx.fillRect(0,0,768,192);ctx.fillStyle=fg;ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 74px Arial';ctx.fillText(text,384,98,710);const texture=new THREE.CanvasTexture(c);texture.colorSpace=THREE.SRGBColorSpace;const mesh=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:texture,side:THREE.DoubleSide}));mesh.position.set(x,y,z);scene.add(mesh);return mesh}
for(let z=10;z>-52;z-=3.5){block(24,.012,.025,0,.024,z,'#9b9a94');for(let x=-11;x<12;x+=3.2)block(.025,.012,3.4,x,.027,z-1.7,'#aaa59d')}
for(let z=8;z>-51;z-=8){for(const x of [-10.5,10.5]){cylinder(.27,.31,8,x,4,z,'#e5ddd0');cylinder(.37,.37,.16,x,7.95,z,gold,.65);cylinder(.4,.4,.12,x,.2,z,gold,.65)}for(const x of [-6,0,6]){const glow=block(3,.07,.4,x,8.7,z,'#fff3d8');glow.material.emissive=new THREE.Color('#f4d3a2');glow.material.emissiveIntensity=1.8}}
for(let z=7;z>-50;z-=8){for(const x of [-3.6,3.6]){cylinder(.58,.5,.6,x,.36,z,'#4d4e53',.2);cylinder(.13,.19,1.15,x,1.1,z,'#7e6248');const leaves=new THREE.Mesh(new THREE.IcosahedronGeometry(.84,1),new THREE.MeshStandardMaterial({color:'#3b7055',roughness:.95}));leaves.position.set(x,1.75,z);scene.add(leaves)}}
textPlane('JOUMERA  •  GRAND ATRIUM',10,1.2,0,7.1,-47,'#f3d7a6','#172335');

const stands=[{name:'TECH STUDIO',type:'Electronics',x:-7,z:3,color:'#416e9a',products:[['Wireless Headphones',39],['Portable Speaker',29],['USB-C Hub',24]]},{name:'HOME GALLERY',type:'Home & Living',x:7,z:3,color:'#aa735d',products:[['Ceramic Vase',35],['Table Lamp',59],['Cushion Set',27]]},{name:'STYLE LAB',type:'Fashion',x:-7,z:-13,color:'#7869a8',products:[['Urban Backpack',49],['Classic Watch',79]]},{name:'SMART LIVING',type:'Lifestyle',x:7,z:-13,color:'#4e8c80',products:[['Desk Organizer',19],['LED Light',32]]}];
const clickable=[];let destination=null,arrival=null;const nav=document.getElementById('shopnav');for(const s of stands){block(7,.18,7,s.x,0,s.z,s.color);block(7,5,.4,s.x,2.5,s.z-3.4,s.color);block(.25,5,7,s.x+(s.x>0?3.4:-3.4),2.5,s.z,s.color);block(6.2,.18,1.5,s.x,1.3,s.z-.8,'#d5c4a9');for(let j=0;j<3;j++){const m=block(.9,1,.9,s.x-1.8+j*1.8,1.9,s.z-.8,'#e6d6b9',.25);m.userData.stand=s;clickable.push(m)}const sign=block(5.6,.65,.2,s.x,4.5,s.z-3.08,'#e8bc81');sign.userData.stand=s;clickable.push(sign)}

/* Richer showrooms: translucent glass, lit brand signs, mannequins, shelving, spotlight pools */
for(const s of stands){
  const edge=s.x>0?3.37:-3.37;
  const frame=block(7.4,.26,.45,s.x,5.35,s.z+3.2,gold,.7);
  for(const x of [s.x-3.4,s.x+3.4])block(.19,5,.3,x,2.5,s.z+3.1,gold,.55);
  const glass=new THREE.Mesh(new THREE.PlaneGeometry(6.7,4.6),new THREE.MeshPhysicalMaterial({color:'#bdd4df',transparent:true,opacity:.12,roughness:.1,metalness:.2,side:THREE.DoubleSide,depthWrite:false}));
  glass.position.set(s.x,2.7,s.z+3.05);scene.add(glass);
  textPlane(s.name,5.7,.74,s.x,4.86,s.z+3.35,'#f5e2c6','#182438');
  for(const j of [-1,1]){
    block(.85,1.1,.7,s.x+j*2,1.93,s.z+.9,'#f0e9df',.12);
    block(1.1,.12,.9,s.x+j*2,1.25,s.z+.9,gold,.5);
    cylinder(.14,.14,.7,s.x+j*2,2.7,s.z+.9,'#d2b38b',.55);
  }
  const mat=new THREE.MeshStandardMaterial({color:s.color,emissive:s.color,emissiveIntensity:.65});
  const strip=new THREE.Mesh(new THREE.BoxGeometry(5.5,.045,.06),mat);strip.position.set(s.x,4.27,s.z+3.3);scene.add(strip);
  for(const x of [s.x-2.5,s.x+2.5]){const bulb=new THREE.PointLight('#f5dfbf',1.2,8,2);bulb.position.set(x,4.8,s.z+1.5);scene.add(bulb)}
  const door=block(5.8,.03,.15,s.x,.1,s.z+3.35,gold,.5);door.userData.stand=s;clickable.push(door);
  const portal=new THREE.Mesh(new THREE.PlaneGeometry(6.6,4.2),new THREE.MeshBasicMaterial({transparent:true,opacity:0,side:THREE.DoubleSide,depthWrite:false}));
  portal.position.set(s.x,2.5,s.z+3.48);portal.userData.stand=s;scene.add(portal);clickable.push(portal);
}

stands.forEach((s,i)=>{const b=document.createElement('button');b.textContent=(i+1)+' · '+s.name;b.onclick=()=>visit(s);nav.appendChild(b)});function visit(s){destination=new THREE.Vector3(s.x>0?2.4:-2.4,2.15,s.z+7.3);arrival=s;document.querySelector('.intro').classList.add('hide');panel.hidden=true;document.getElementById('hint').textContent='Arriving at '+s.name+'…'}
const tiles=[];for(let z=10;z>-50;z-=4)tiles.push(block(1,.025,2,0,.06,z,'#d7b68b'));
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();let moved=false,downX=0,lastX=0;canvas.addEventListener('pointerdown',e=>{downX=lastX=e.clientX;moved=false;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(e.buttons){if(Math.abs(e.clientX-downX)>8)moved=true;yaw-=(e.clientX-lastX)*.004;lastX=e.clientX}});canvas.addEventListener('pointerup',e=>{if(moved)return;const r=canvas.getBoundingClientRect();pointer.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(pointer,camera);const hit=ray.intersectObjects(clickable)[0];if(hit)openStand(hit.object.userData.stand)});
let cart=JSON.parse(localStorage.getItem('joumera-vmall-cart')||'[]');function update(){document.getElementById('count').textContent=cart.length;localStorage.setItem('joumera-vmall-cart',JSON.stringify(cart))}update();
const panel=document.getElementById('panel'),body=document.getElementById('panelBody');function show(title,sub,html){panel.hidden=false;document.getElementById('panelTitle').textContent=title;document.getElementById('panelSub').textContent=sub;body.innerHTML=html}
function openStand(s){show(s.name,s.type+' · Demo showroom',s.products.map((p,i)=>'<div class="product"><div><b>'+p[0]+'</b><div class="muted">$'+p[1]+'</div></div><button data-add="'+i+'">Add to cart</button></div>').join('')+'<a class="primary" style="display:inline-block;text-decoration:none;margin:10px 0" href="./product.html">View 360° product studio ↗</a><p class="note">Demo products only. No live inventory or checkout is connected.</p>');body.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const p=s.products[+b.dataset.add];cart.push({name:p[0],price:p[1],vendor:s.name});update();b.textContent='Added ✓'})}
document.getElementById('cartBtn').onclick=()=>{const total=cart.reduce((a,p)=>a+p.price,0);show('Your cart',cart.length+' demo items',cart.map((p,i)=>'<div class="product"><span>'+p.name+'<br><small class="muted">'+p.vendor+'</small></span><span>$'+p.price+' <button data-remove="'+i+'">×</button></span></div>').join('')+'<h2>Total: $'+total+'</h2><p class="note">Checkout will be enabled after payment and inventory integration.</p>');body.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{cart.splice(+b.dataset.remove,1);update();document.getElementById('cartBtn').click()})};
document.getElementById('close').onclick=()=>panel.hidden=true;document.getElementById('enter').onclick=()=>visit(stands[0]);document.getElementById('reset').onclick=()=>{camera.position.set(0,2.2,12);yaw=0;destination=null;arrival=null;panel.hidden=true;document.querySelector('.intro').classList.remove('hide');document.getElementById('hint').textContent='Choose a showroom below'};
function move(dir){destination=null;arrival=null;const step=.85;if(dir==='forward')camera.position.z-=step;if(dir==='back')camera.position.z+=step;if(dir==='left')camera.position.x-=step;if(dir==='right')camera.position.x+=step;camera.position.x=Math.max(-3,Math.min(3,camera.position.x));camera.position.z=Math.max(-42,Math.min(13,camera.position.z))}
document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>move(b.dataset.move));document.addEventListener('keydown',e=>{if(['ArrowUp','w'].includes(e.key))move('forward');if(['ArrowDown','s'].includes(e.key))move('back');if(['ArrowLeft','a'].includes(e.key))move('left');if(['ArrowRight','d'].includes(e.key))move('right')});
function frame(){if(destination){camera.position.lerp(destination,.055);yaw+=(0-yaw)*.055;if(camera.position.distanceTo(destination)<.15){camera.position.copy(destination);destination=null;if(arrival){openStand(arrival);document.getElementById('hint').textContent=arrival.name;arrival=null}}}const w=canvas.clientWidth,h=canvas.clientHeight;if(w&&h&&(camera.aspect!==w/h)){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}camera.rotation.set(0,yaw,0);renderer.render(scene,camera);requestAnimationFrame(frame)}frame();
</script></body></html>
